<html>
<head>
<title>Factorial</title>
<script language="javascript">
var n,i,fact=1;
n=parseInt(window.prompt("Enter a number to find its factorial"))
  if (n==0)
  {
    document.writeln("Factorial is 1");
  }
  else
  {
    for(i=1;i<=n;i++)
    {
    fact=fact*i;
    }
    document.writeln("Factorial is :- "+fact);    
  }  
</script>
</head>
<body>
</body>
</html>

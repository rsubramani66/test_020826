<html>
<head>
<title>Validations</title>
<script language="javascript">
function validate()
{
  var uname;pwd;cpwd;email;
  uname=document.forms["frm1"].uname.value;
  pwd=document.forms("frm1").pwd.value;
  cpwd=document.forms("frm1").cpwd.value;
  email=document.forms("frm1").email.value;
  if(uname==" ")
   {
     alert("Enter all details");
   } 
   else if(pwd==" ")
   {
     alert("Enter all details");
   }
   else if(cpwd==" ")
   {
     alert("Enter all details");
   }
   else if(email==" ")
   {
     alert("Enter all details");
   }
  else if(uname.length<8)
  {
    alert("username must be atleast 8 characters");
  }
  else if(pwd.length<6)
  {
     alert("Password must be atleast 6 charecters");     
  }
  else if(pwd!=cpwd)
  {
    alert("Passwords did not match");
  }
  else
  {
    alert("Success");
  }
}
</script>
</head>

</body>
</html>
